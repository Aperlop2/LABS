<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

</head>

<body>
  Hello world
  <script src="script.js"></script>

  <!--
  This script places a badge on your repl's full-browser view back to your repl's cover
  page. Try various colors for the theme: dark, light, red, orange, yellow, lime, green,
  teal, blue, blurple, magenta, pink!
  -->

  <div class="container">
    <button class="btn-solid btn-styled theme-primary">Primary</button>
    <button class="btn-solid btn-styled theme-accent">Accent</button>
    <button class="btn-solid btn-styled theme-success">Success</button>

    <!-- utilidades para alinear el texto -->

    <p class="text-left">Izquierda</p>
    <p class="text-center" style="color:red">Centro</p>
    <p class="text-right">Derecha</p>

    <!-- anadir una targeta que tenga un grupo de listas -->

    <div class="card card-subtle theme-accent">
      <h2>Hoja de ruta</h2>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxL2qA4rHSYyyeGfemPeoLT1jvSVlATWhXTMkIw43iww&s=10" alt="Hoja de ruta" class="rounded float-start" >
      <ul class="list-group list-group-flush">
        <li class="list-group-item">1. Manzana</li>
        <li class="list-group-item">2. Naranja</li>
        <li class="list-group-item">3. Platano</li>
        
    </div>

  </div>



  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>
</body>

</html>
